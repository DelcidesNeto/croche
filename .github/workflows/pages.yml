name: Publicar no GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm test
      # Só o que o navegador usa; a API (pasta api/) é publicada na Cloudflare com `npm run api:deploy`.
      # O GitHub Pages deixa o navegador guardar cada arquivo por 10 minutos: numa pasta por versão,
      # uma página nova nunca carrega módulos antigos guardados.
      - run: |
          version=${GITHUB_SHA::7}
          mkdir -p _site/$version
          cp -r src styles _site/$version/
          sed -e "s#\"styles/#\"$version/styles/#g" -e "s#\"src/#\"$version/src/#g" index.html > _site/index.html
          grep -q "$version/src/main.js" _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
